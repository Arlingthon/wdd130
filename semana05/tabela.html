<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/tabela.css">
    <title>Tabelas do Jefferson</title>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Liga</th>
                <th>Time</th>
                <th>Retrospecto (vitórias-derrotas)</th>
                <th>Número de Jogadores</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Sul</td>
                <td id="equipe">Paraná</td>
                <td>52-19</td>
                <td>23</td>
            </tr>
            <tr>
                <td id="equipe">Santa Catarina</td>
                <td>49-24</td>
                <td>10</td>
            <tr>
                <td rowspan="3">Oeste</td>
                <td id="equipe">Lacerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <tr>
                <td id="equipe">Acre</td>
                <td>75-87</td>
                <td>20</td>
            </tr>
            <tr>
                <td id="equipe">Rondônia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total de Jogadores</th>
                <td>92</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
