<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>
    <main>
        <h1>Questionário de HTML e CSS</h1>
        <form class="container-formulario">
            <div class="pergunta">
                <label for="q1">1. O que significa a sigla CSS?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="pergunta">
                <label for="q2">2. Como os atributos 'id' e 'Class' são selecionados no
                    CSS?</label>
                <textarea name="q2" id="q2" rows="2"></textarea>
            </div>
            <div class="pergunta">
                <label for="q3">3. Qual das opções abaixo é um comentário CSS
                    válido?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Escolha uma...</option>
                    <option value="option1">Opção 1</option>
                    <option value="option2">Opção 2</option>
                    <option value="option3">Opção 3</option>
                </select>
            </div>
            <div class="pergunta">
                <label for="q4">4. Qual é a margem inferior dada por esta
                    declaração?</label>
                <div class="codigo-box">
                    <code>margin: 10px 5px 15px;</code>
                </div>
                <input class="space" type="number" name="q4" id="q4">
            </div>
            <div>
                <button type="submit">Enviar Questionário</button>
            </div>
        </form>
    </main>
    <footer></footer>
</body>

</html>
